<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图像金字塔 · 多分辨率渲染 Demo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>图像金字塔 · 高斯/拉普拉斯多分辨率渲染</h1>
    <div class="toolbar">
      <select id="img-size">
        <option value="2048">2048 x 2048</option>
        <option value="4096" selected>4096 x 4096</option>
        <option value="8192">8192 x 8192</option>
      </select>
      <button id="generate">生成测试图并构建金字塔</button>
      <label class="file-label">打开图片<input type="file" id="file-input" accept="image/*"></label>
      <button id="clear-db">清除缓存</button>
      <button id="fit">适应窗口</button>
      <button id="benchmark">分层渲染基准</button>
    </div>
    <div class="progress-wrap"><div id="progress"></div></div>
    <div id="status">初始化…</div>
  </header>

  <main>
    <aside>
      <section>
        <h2>视图</h2>
        <label class="row">缩放
          <input type="range" id="zoom-slider" min="-6" max="6" step="0.01" value="-2">
        </label>
        <label class="row"><input type="checkbox" id="show-grid"> 显示瓦片边界</label>
        <label class="row"><input type="checkbox" id="laplacian"> 拉普拉斯视图</label>
        <label class="row"><input type="checkbox" id="singleRes"> 单分辨率降级</label>
        <label class="row">缓存预算 <span id="cache-budget-label">256 MB</span>
          <input type="range" id="cache-budget" min="16" max="1024" step="16" value="256">
        </label>
      </section>

      <section>
        <h2>实时指标</h2>
        <table class="stats">
          <tr><td>FPS</td><td id="stat-fps">-</td></tr>
          <tr><td>帧渲染耗时</td><td id="stat-frame">-</td></tr>
          <tr><td>当前层</td><td id="stat-level">-</td></tr>
          <tr><td>缩放比</td><td id="stat-scale">-</td></tr>
          <tr><td>瓦片缓存</td><td id="stat-cache">-</td></tr>
          <tr><td>命中/未命中</td><td id="stat-hit">-</td></tr>
          <tr><td>JS 堆内存</td><td id="stat-heap">-</td></tr>
          <tr><td>长任务数</td><td id="stat-longtask">-</td></tr>
        </table>
      </section>

      <section>
        <h2>金字塔构建（每层）</h2>
        <table id="level-table" class="data">
          <thead><tr><th>层</th><th>尺寸</th><th>耗时 ms</th><th>瓦片</th><th>字节</th><th>重建误差</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>

      <section>
        <h2>分层渲染基准</h2>
        <table id="bench-table" class="data">
          <thead><tr><th>层</th><th>均帧 ms</th><th>峰值 ms</th><th>缓存</th><th>堆内存</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
    </aside>

    <div class="canvas-wrap">
      <canvas id="view"></canvas>
      <div class="hint">滚轮缩放 · 拖拽平移 · 双击复位</div>
    </div>
  </main>

  <script src="js/pyramid-core.js"></script>
  <script src="js/idb.js"></script>
  <script src="js/tile-cache.js"></script>
  <script src="js/metrics.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
